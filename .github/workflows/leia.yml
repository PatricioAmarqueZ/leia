name: Leia daily scan
on:
  # Main trigger: an external scheduler (cron-job.org) calls workflow_dispatch on time.
  # GitHub's own cron below is only a backup: it often runs hours late, and late runs
  # update the app without sending a phone alert (see push_slot in leia/run.py).
  workflow_dispatch:
    inputs:
      force_push:
        description: "Send a test alert even outside the alert windows"
        type: boolean
        default: false
  schedule:
    - cron: "17 11 * * 1-5"
    - cron: "41 20 * * 1-5"
permissions:
  contents: write
concurrency: leia-scan
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m leia.run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LEIA_DASHBOARD_URL: ${{ vars.LEIA_DASHBOARD_URL }}
          LEIA_FORCE_PUSH: ${{ inputs.force_push && '1' || '0' }}
      - name: Save scan
        run: |
          git config user.name "leia-bot"
          git config user.email "leia-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Leia scan $(date -u +%F-%H%M)"
          git pull --rebase -q && git push
