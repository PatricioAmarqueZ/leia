name: Leia daily scan
on:
  schedule:
    # Weekdays. Times are UTC: 12:30 = 7:30am ET in winter (8:30am in summer), 21:30 = after the close.
    - cron: "30 12 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: leia-scan
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m leia.run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LEIA_DASHBOARD_URL: ${{ vars.LEIA_DASHBOARD_URL }}
      - name: Save scan
        run: |
          git config user.name "leia-bot"
          git config user.email "leia-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Leia scan $(date -u +%F-%H%M)"
          git push
